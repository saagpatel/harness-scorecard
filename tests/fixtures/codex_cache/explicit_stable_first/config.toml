model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[prompt_cache_options]
mode = "explicit"
ttl = "30m"

[[input]]
role = "developer"
content = [
  { type = "input_text", text = "Stable policy and rubric context.", prompt_cache_breakpoint = { mode = "explicit" } },
]

[[input]]
role = "user"
content = [
  { type = "input_text", text = "Volatile project state." },
]
