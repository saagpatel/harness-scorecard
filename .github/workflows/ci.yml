name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            experimental: false
          - python: "3.13"
            experimental: false
          - python: "3.14"
            experimental: false
          # uv 0.12.12 offers 3.15.0rc2 as a managed download.
          - python: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_MANAGED_PYTHON: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.12"

      - name: Set up Python
        run: uv python install "${{ matrix.python }}"

      - name: Sync dependencies (locked)
        run: make setup

      - name: Check
        run: make check

      - name: Self-scan smoke test
        run: uv run --no-sync harness-scorecard scan tests/fixtures/strong_harness --min-grade A
